  <link rel="stylesheet" href="website project.css" />

  <nav class="main-nav">

<!-- search bar -->

        <button id="btn-search-go" class="btn-search-go" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
<!-- ── Page body ── -->
  <section class="page-body">
  <main class="main-content">
      <!-- Toolbar -->
      <div class="toolbar">
        <div>
          <div id="result-count" class="result-count">Searching…</div>
          <div id="result-query" class="result-query"></div>
        </div>
          </div>
        </div>
      </div>
    <!-- Results -->
